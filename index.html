<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Metrics Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --border:#2a2f3a; --text:#e6e9ef;
    --muted:#9aa3b2; --accent:#7c9cff; --err:#f87171; --ok:#34d399;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
           border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:14px; }
  h1 { font-size:20px; margin:0; }
  .tagline { color:var(--muted); font-size:13px; flex:1 1 300px; }
  .lang button { background:var(--panel); color:var(--muted); border:1px solid var(--border);
                 padding:3px 10px; cursor:pointer; font-size:12px; }
  .lang button.active { color:var(--text); border-color:var(--accent); }
  textarea { width:100%; min-height:130px; background:var(--panel); color:var(--text);
             border:1px solid var(--border); border-radius:8px; padding:10px;
             font:12px/1.45 ui-monospace, Consolas, monospace; resize:vertical; }
  .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  button.act { background:var(--accent); color:#0d1117; border:0; border-radius:6px;
               padding:7px 16px; font-weight:600; cursor:pointer; }
  button.ghost { background:var(--panel); color:var(--text); border:1px solid var(--border);
                 border-radius:6px; padding:7px 14px; cursor:pointer; }
  .error { display:none; background:#2a1215; border:1px solid #7f1d1d; color:#fca5a5;
           border-radius:8px; padding:10px 12px; margin-top:10px; white-space:pre-wrap;
           font-family:ui-monospace, Consolas, monospace; font-size:12px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
          gap:10px; margin-top:14px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .card .k { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  .card .v { font-size:20px; font-weight:650; margin-top:2px; }
  .card .note { color:var(--muted); font-size:11px; margin-top:2px; }
  .chip { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; margin:2px 4px 0 0;
          border:1px solid var(--border); }
  .charts { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
  @media (max-width:820px) { .charts { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px; }
  .panel h3 { margin:0 0 8px; font-size:13px; color:var(--muted); font-weight:600; }
  .legend { margin-bottom:6px; }
  .chart-box { position:relative; }
  table { width:100%; border-collapse:collapse; margin-top:14px; font-size:12.5px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; }
  td.num { font-variant-numeric:tabular-nums; }
  .sp-dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  footer { max-width:1100px; margin:18px auto 26px; padding:0 16px; color:var(--muted); font-size:12px; }
  footer a { color:var(--accent); }
  .attrib { border-left:3px solid var(--accent); padding:4px 10px; margin-top:6px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-i18n="title">Voice Metrics Dashboard</h1>
    <div class="tagline" data-i18n="tagline"></div>
    <div class="lang">
      <button id="langEn" class="active">EN</button>
      <button id="langEs">ES</button>
    </div>
  </header>

  <label for="paste" data-i18n="paste">Transcript JSON</label>
  <textarea id="paste" spellcheck="false"
    data-i18n-ph="ph" placeholder='[{"speaker":"bot","start":0,"end":3.2,"text":"Hello"}]  ·  [{"role":"customer","t0":4.1,"t1":9.7}]  ·  {"turns":[…]}'></textarea>
  <div class="row">
    <button id="analyze" class="act" data-i18n="analyze">Analyze</button>
    <button id="demo" class="ghost" data-i18n="demo">Load demo</button>
    <button id="clear" class="ghost" data-i18n="clear">Clear</button>
  </div>
  <div id="error" class="error"></div>

  <div id="out" style="display:none">
    <div class="kpis" id="kpis"></div>

    <div class="charts">
      <div class="panel">
        <h3 data-i18n="chTimeline">Turn timeline</h3>
        <div class="legend" id="legend"></div>
        <div class="chart-box" id="tlBox"><canvas id="timeline"></canvas></div>
      </div>
      <div class="panel">
        <h3 data-i18n="chGaps">Gap distribution</h3>
        <div class="chart-box" style="height:260px"><canvas id="gaps"></canvas></div>
      </div>
    </div>

    <div class="panel" style="margin-top:14px; overflow-x:auto">
      <table id="tbl"><thead></thead><tbody></tbody></table>
    </div>
  </div>
</main>

<footer>
  <div class="attrib" data-i18n="attrib">KPI thinking from trajectory grammars for voice-agent conversations (D. García Peña)</div>
  <div><span data-i18n="footer">Built by</span> <a href="https://huggingface.co/iamdgarcia" target="_blank" rel="noopener">iamdgarcia</a>
   · research: <a href="https://huggingface.co/iamdgarcia" target="_blank" rel="noopener">huggingface.co/iamdgarcia</a></div>
</footer>

<script id="vmd-pure">
// Pure functions — no DOM. Node self-check runs this block with a window stub.
window.VMD = (function () {
  const HANDOFF_RX = /\b(?:human|agente|transfer|handoff|representante)\b/i;

  function parseTime(v) {
    if (typeof v === 'number' && isFinite(v)) return v;
    if (typeof v === 'string') {
      const s = v.trim().replace(',', '.');
      if (/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
      const parts = s.split(':').map(Number);
      if (parts.length >= 2 && parts.length <= 3 && parts.every(p => isFinite(p))) {
        return parts.reduce((acc, p) => acc * 60 + p, 0);
      }
    }
    return null;
  }

  // Accepts: [turns], or {turns|segments|dialogue|utterances|data:[...]}. Aliases per field.
  // Returns {turns:[{speaker,start,end,text}]} sorted by start. Throws Error with a clear message.
  function normalize(raw) {
    let arr = raw;
    if (raw && typeof raw === 'object' && !Array.isArray(raw)) {
      arr = raw.turns ?? raw.segments ?? raw.dialogue ?? raw.utterances ?? raw.data;
      if (!Array.isArray(arr)) {
        throw new Error('Object input must contain a turns array (accepted keys: turns, segments, dialogue, utterances, data).');
      }
    }
    if (!Array.isArray(arr)) {
      throw new Error('Input must be a JSON array of turns, or an object with a "turns" array.');
    }
    if (!arr.length) throw new Error('No turns found: the transcript is empty.');
    const SPK = ['speaker', 'role', 'speaker_label', 'who', 'name'];
    const T0 = ['start', 't0', 'begin', 'from'];
    const T1 = ['end', 't1', 'stop', 'to', 'until'];
    const TXT = ['text', 'content', 'message', 'utterance'];
    const pick = (o, keys) => {
      for (const k of keys) if (o[k] !== undefined && o[k] !== null && o[k] !== '') return o[k];
      return undefined;
    };
    const turns = arr.map((it, i) => {
      if (!it || typeof it !== 'object' || Array.isArray(it)) {
        throw new Error('Turn #' + (i + 1) + ' is not an object.');
      }
      const start = parseTime(pick(it, T0));
      const end = parseTime(pick(it, T1));
      if (start === null) throw new Error('Turn #' + (i + 1) + ': missing or invalid start time (accepted: seconds number, "mm:ss", "hh:mm:ss").');
      if (end === null) throw new Error('Turn #' + (i + 1) + ': missing or invalid end time.');
      if (end < start) throw new Error('Turn #' + (i + 1) + ': end (' + end + 's) is before start (' + start + 's).');
      const spk = pick(it, SPK);
      const txt = pick(it, TXT);
      return { speaker: spk === undefined ? 'unknown' : String(spk), start, end, text: typeof txt === 'string' ? txt : '' };
    });
    turns.sort((a, b) => a.start - b.start);
    return { turns };
  }

  function median(sorted) {
    const n = sorted.length;
    if (!n) return 0;
    const m = n >> 1;
    return n % 2 ? sorted[m] : (sorted[m - 1] + sorted[m]) / 2;
  }

  function quantileNearestRank(sorted, p) {
    if (!sorted.length) return 0;
    const idx = Math.min(sorted.length - 1, Math.max(0, Math.ceil(p / 100 * sorted.length) - 1));
    return sorted[idx];
  }

  function computeKpis(turns) {
    const n = turns.length;
    if (!n) throw new Error('No turns.');
    const durationSec = turns[n - 1].end - turns[0].start;
    const bySp = new Map();
    for (const t of turns) {
      const d = Math.max(0, t.end - t.start);
      bySp.set(t.speaker, (bySp.get(t.speaker) || 0) + d);
    }
    const gapsMs = [];
    let interruptions = 0, longestSilenceMs = 0;
    for (let i = 1; i < n; i++) {
      const g = (turns[i].start - turns[i - 1].end) * 1000;
      if (g < 0) {
        interruptions++;          // overlap = barge-in, not a silence gap
      } else {
        gapsMs.push(g);
        if (g > longestSilenceMs) longestSilenceMs = g;
      }
    }
    const sorted = [...gapsMs].sort((a, b) => a - b);
    const handoffTurns = turns.filter(t => HANDOFF_RX.test(t.text || '')).length;
    const speechSec = turns.reduce((s, t) => s + Math.max(0, t.end - t.start), 0);
    const wordTotal = turns.reduce((s, t) => s + wordCount(t.text), 0);
    return {
      totalTurns: n,
      durationSec,
      hasText: wordTotal > 0,
      wordsPerSecond: wordTotal > 0 ? wordTotal / Math.max(speechSec, 1e-9) : null,
      talkBySpeaker: [...bySp.entries()].sort((a, b) => b[1] - a[1])
        .map(([speaker, sec]) => ({ speaker, sec, pct: sec / Math.max(speechSec, 1e-9) * 100 })),
      gapsMs: sorted,
      medianGapMs: median(sorted),
      p95GapMs: quantileNearestRank(sorted, 95),
      longestSilenceMs,
      interruptions,
      handoffTurns,
      containmentPct: (1 - handoffTurns / n) * 100
    };
  }

  function gapBuckets(turns) {
    const counts = [0, 0, 0, 0];
    let overlaps = 0;
    for (let i = 1; i < turns.length; i++) {
      const g = (turns[i].start - turns[i - 1].end) * 1000;
      if (g < 0) overlaps++;
      else if (g < 300) counts[0]++;
      else if (g < 700) counts[1]++;
      else if (g < 1500) counts[2]++;
      else counts[3]++;
    }
    return { labels: ['0-300 ms', '300-700 ms', '700-1500 ms', '1500+ ms'], counts, overlaps };
  }

  const PALETTE = ['#60a5fa', '#f472b6', '#34d399', '#fbbf24', '#a78bfa', '#f87171', '#22d3ee'];
  function speakerColors(turns) {
    const map = new Map();
    for (const t of turns) if (!map.has(t.speaker)) map.set(t.speaker, PALETTE[map.size % PALETTE.length]);
    return map;
  }

  function fmtTime(s) {
    s = Math.max(0, Math.round(s));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(sec).padStart(2, '0');
  }

  function fmtMs(ms) { return Math.round(ms) + ' ms'; }

  function wordCount(text) {
    return text && text.trim() ? text.trim().split(/\s+/).filter(Boolean).length : 0;
  }

  // Banking-style Spanish demo: 14 turns, one interruption (t5), one handoff phrase (t13).
  const DEMO = [
    { speaker: 'bot', start: 0.0, end: 3.2, text: 'Hola, soy tu asistente virtual del Banco Uno. ¿En qué puedo ayudarte?' },
    { speaker: 'customer', start: 4.1, end: 9.7, text: 'Quiero consultar el saldo de mi cuenta y también una transferencia que hice ayer.' },
    { speaker: 'bot', start: 10.2, end: 13.9, text: 'Claro. Tu saldo disponible es de 1.240,50 euros.' },
    { speaker: 'bot', start: 14.1, end: 17.0, text: '¿Quieres ver el detalle de la transferencia del martes?' },
    { speaker: 'customer', start: 15.6, end: 21.4, text: 'Sí, es que no me ha llegado al destinatario todavía.' },
    { speaker: 'bot', start: 22.3, end: 26.8, text: 'La transferencia de 350 euros está en proceso; llegará hoy antes de las seis.' },
    { speaker: 'customer', start: 27.5, end: 34.0, text: 'Vale, perfecto. Otra cosa: quiero pedir una tarjeta adicional para mi hija.' },
    { speaker: 'bot', start: 34.8, end: 40.2, text: 'Puedo iniciar la solicitud. Primero verificaré tu identidad con un código que te envío por SMS.' },
    { speaker: 'customer', start: 41.0, end: 44.5, text: 'Me ha llegado el código: 4 8 2 9 1.' },
    { speaker: 'bot', start: 45.1, end: 50.9, text: 'Identidad verificada. La solicitud de la tarjeta adicional está creada.' },
    { speaker: 'customer', start: 52.0, end: 58.3, text: 'Gracias. Y quiero reclamar un cargo de 89 euros de octubre que no reconozco.' },
    { speaker: 'bot', start: 59.0, end: 63.7, text: 'Las reclamaciones de cargos requieren atención personalizada.' },
    { speaker: 'bot', start: 64.0, end: 66.5, text: 'Le transfiero con un agente humano; un momento, por favor.' },
    { speaker: 'customer', start: 68.2, end: 71.0, text: 'Vale, gracias.' }
  ];

  return { parseTime, normalize, computeKpis, gapBuckets, speakerColors, fmtTime, fmtMs, wordCount, DEMO, HANDOFF_RX };
})();
</script>

<script>
(function () {
  const VMD = window.VMD;
  const $ = id => document.getElementById(id);

  const I18N = {
    en: {
      title: 'Voice Metrics Dashboard',
      tagline: 'Paste a voice-agent transcript JSON — get conversation KPIs and a timeline instantly. Everything runs in your browser; nothing is uploaded.',
      paste: 'Transcript JSON',
      ph: '[{"speaker":"bot","start":0,"end":3.2,"text":"Hello"}]  ·  [{"role":"customer","t0":4.1,"t1":9.7}]  ·  {"turns":[…]}',
      analyze: 'Analyze', demo: 'Load demo', clear: 'Clear',
      errInvalid: 'Invalid JSON: ',
      kTurns: 'Turns', kDuration: 'Duration', kTalk: 'Talk time', kMedian: 'Median gap',
      kP95: 'p95 gap', kSilence: 'Longest silence', kInterr: 'Interruptions',
      kWps: 'Words / second', kContain: 'Containment (est.)',
      kContainNote: '{n} handoff turn(s) detected',
      chTimeline: 'Turn timeline', chGaps: 'Gap distribution', secAxis: 'seconds',
      thIndex: '#', thSpeaker: 'Speaker', thStart: 'Start', thEnd: 'End',
      thDur: 'Duration', thGap: 'Gap before', thWords: 'Words',
      attrib: 'KPI thinking from trajectory grammars for voice-agent conversations (D. García Peña)',
      footer: 'Built by'
    },
    es: {
      title: 'Panel de Métricas de Voz',
      tagline: 'Pega un JSON de transcripción de un agente de voz — obtén KPIs de conversación y una línea de tiempo al instante. Todo se ejecuta en tu navegador; nada se sube.',
      paste: 'JSON de transcripción',
      ph: '[{"speaker":"bot","start":0,"end":3.2,"text":"Hola"}]  ·  [{"role":"customer","t0":4.1,"t1":9.7}]  ·  {"turns":[…]}',
      analyze: 'Analizar', demo: 'Cargar demo', clear: 'Limpiar',
      errInvalid: 'JSON no válido: ',
      kTurns: 'Turnos', kDuration: 'Duración', kTalk: 'Tiempo de habla', kMedian: 'Gap mediano',
      kP95: 'Gap p95', kSilence: 'Silencio más largo', kInterr: 'Interrupciones',
      kWps: 'Palabras / segundo', kContain: 'Contención (est.)',
      kContainNote: '{n} turno(s) de handoff',
      chTimeline: 'Línea de tiempo de turnos', chGaps: 'Distribución de gaps', secAxis: 'segundos',
      thIndex: '#', thSpeaker: 'Hablante', thStart: 'Inicio', thEnd: 'Fin',
      thDur: 'Duración', thGap: 'Gap previo', thWords: 'Palabras',
      attrib: 'KPIs basados en «trajectory grammars for voice-agent conversations» (D. García Peña)',
      footer: 'Construido por'
    }
  };
  let lang = 'en';
  let charts = { timeline: null, gaps: null };
  let last = null; // {turns, kpis, buckets}

  const t = key => I18N[lang][key] ?? key;

  function renderI18n() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    $('langEn').classList.toggle('active', lang === 'en');
    $('langEs').classList.toggle('active', lang === 'es');
    if (last) renderAll();
  }

  function showError(msg) {
    const el = $('error');
    el.textContent = msg;
    el.style.display = 'block';
    $('out').style.display = 'none';
  }

  function hideError() { $('error').style.display = 'none'; }

  function analyze() {
    let raw;
    try {
      raw = JSON.parse($('paste').value);
    } catch (e) {
      showError(t('errInvalid') + e.message);
      return;
    }
    try {
      const { turns } = VMD.normalize(raw);
      last = { turns, kpis: VMD.computeKpis(turns), buckets: VMD.gapBuckets(turns) };
      hideError();
      $('out').style.display = '';
      renderAll();
    } catch (e) {
      showError(e.message);
    }
  }

  function kpiCard(k, v, note) {
    return '<div class="card"><div class="k">' + k + '</div><div class="v">' + v + '</div>' +
           (note ? '<div class="note">' + note + '</div>' : '') + '</div>';
  }

  function renderKpis() {
    const k = last.kpis;
    const talk = k.talkBySpeaker.map(s =>
      '<span class="chip"><span class="sp-dot" style="background:' +
      VMD.speakerColors(last.turns).get(s.speaker) + '"></span>' +
      s.speaker + ' ' + s.pct.toFixed(0) + '%</span>').join('');
    $('kpis').innerHTML =
      kpiCard(t('kTurns'), k.totalTurns) +
      kpiCard(t('kDuration'), VMD.fmtTime(k.durationSec)) +
      kpiCard(t('kTalk'), k.talkBySpeaker.length ? k.talkBySpeaker[0].pct.toFixed(0) + '%' : '—', talk) +
      kpiCard(t('kMedian'), VMD.fmtMs(k.medianGapMs)) +
      kpiCard(t('kP95'), VMD.fmtMs(k.p95GapMs)) +
      kpiCard(t('kSilence'), VMD.fmtMs(k.longestSilenceMs)) +
      kpiCard(t('kInterr'), k.interruptions) +
      kpiCard(t('kWps'), k.hasText ? k.wordsPerSecond.toFixed(2) : '—', k.hasText ? '' : 'no text') +
      kpiCard(t('kContain'), k.containmentPct.toFixed(0) + '%',
        t('kContainNote').replace('{n}', k.handoffTurns));
  }

  function renderTimeline() {
    const { turns, kpis } = last;
    const colors = VMD.speakerColors(turns);
    $('legend').innerHTML = [...colors.entries()].map(([sp, c]) =>
      '<span class="chip"><span class="sp-dot" style="background:' + c + '"></span>' + sp + '</span>').join('');
    const labels = turns.map((x, i) => '#' + (i + 1) + ' ' + x.speaker);
    const turnData = turns.map(x => [x.start, x.end]);
    const gapData = turns.map((x, i) =>
      i > 0 && x.start > turns[i - 1].end ? [turns[i - 1].end, x.start] : null);
    $('tlBox').style.height = Math.max(220, turns.length * 24 + 60) + 'px';
    if (charts.timeline) charts.timeline.destroy();
    charts.timeline = new Chart($('timeline'), {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { data: gapData, backgroundColor: 'rgba(148,163,184,.16)', barPercentage: .55, categoryPercentage: .9, order: 2 },
          { data: turnData, backgroundColor: turns.map(x => colors.get(x.speaker)), borderRadius: 3, borderSkipped: false, barPercentage: .95, categoryPercentage: .9, order: 1 }
        ]
      },
      options: {
        indexAxis: 'y', maintainAspectRatio: false, animation: false,
        scales: {
          x: { type: 'linear', min: 0, title: { display: true, text: t('secAxis'), color: '#9aa3b2' },
               grid: { color: '#242a35' }, ticks: { color: '#9aa3b2' } },
          y: { reverse: true, grid: { display: false }, ticks: { color: '#9aa3b2', font: { size: 10 } } }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            filter: item => item.datasetIndex === 0,
            callbacks: {
              title: items => {
                const i = items[0].dataIndex, x = turns[i];
                return '#' + (i + 1) + ' ' + x.speaker + (x.text ? ' — ' + x.text.slice(0, 60) : '');
              },
              label: item => {
                const i = item.dataIndex, x = turns[i];
                const gap = i > 0 ? VMD.fmtMs((x.start - turns[i - 1].end) * 1000) : '—';
                return [' ' + VMD.fmtTime(x.start) + ' → ' + VMD.fmtTime(x.end) +
                        ' (' + (x.end - x.start).toFixed(1) + 's)', ' gap: ' + gap];
              }
            }
          }
        }
      }
    });
  }

  function renderGapChart() {
    const b = last.buckets;
    if (charts.gaps) charts.gaps.destroy();
    charts.gaps = new Chart($('gaps'), {
      type: 'bar',
      data: {
        labels: b.labels,
        datasets: [{ data: b.counts,
          backgroundColor: ['#4ade80', '#fbbf24', '#fb923c', '#f87171'], borderRadius: 4 }]
      },
      options: {
        maintainAspectRatio: false, animation: false,
        scales: {
          x: { grid: { display: false }, ticks: { color: '#9aa3b2' } },
          y: { beginAtZero: true, ticks: { color: '#9aa3b2', precision: 0 }, grid: { color: '#242a35' } }
        },
        plugins: { legend: { display: false } }
      }
    });
  }

  function renderTable() {
    const { turns } = last;
    const th = ['thIndex', 'thSpeaker', 'thStart', 'thEnd', 'thDur', 'thGap', 'thWords']
      .map(k => '<th>' + t(k) + '</th>').join('');
    $('tbl').querySelector('thead').innerHTML = '<tr>' + th + '</tr>';
    $('tbl').querySelector('tbody').innerHTML = turns.map((x, i) => {
      const gap = i === 0 ? '—'
        : '<span class="num">' + (x.start < turns[i - 1].end ? '−' : '') +
          VMD.fmtMs(Math.abs(x.start - turns[i - 1].end) * 1000) + '</span>';
      return '<tr><td class="num">' + (i + 1) + '</td>' +
        '<td><span class="sp-dot" style="background:' + VMD.speakerColors(turns).get(x.speaker) + '"></span>' + x.speaker + '</td>' +
        '<td class="num">' + VMD.fmtTime(x.start) + '</td>' +
        '<td class="num">' + VMD.fmtTime(x.end) + '</td>' +
        '<td class="num">' + (x.end - x.start).toFixed(1) + 's</td>' +
        '<td>' + gap + '</td>' +
        '<td class="num">' + VMD.wordCount(x.text) + '</td></tr>';
    }).join('');
  }

  function renderAll() { renderKpis(); renderTimeline(); renderGapChart(); renderTable(); }

  $('analyze').onclick = analyze;
  $('demo').onclick = () => {
    $('paste').value = JSON.stringify(VMD.DEMO, null, 1);
    langDemo();
    analyze();
  };
  // Demo is Spanish; when loading it, Spanish UI reads naturally. EN stays available.
  function langDemo() {
    lang = 'es';
    renderI18n();
  }
  $('clear').onclick = () => {
    $('paste').value = '';
    hideError();
    $('out').style.display = 'none';
    last = null;
  };
  $('langEn').onclick = () => { lang = 'en'; renderI18n(); };
  $('langEs').onclick = () => { lang = 'es'; renderI18n(); };

  renderI18n(); // fill static labels (dict values for tagline/ph start empty in HTML)
})();
</script>
</body>
</html>
